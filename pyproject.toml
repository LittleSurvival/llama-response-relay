[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llamacpp-launcher"
version = "0.1.0"
description = "A profile-based Windows launcher for llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
    "HardwareMonitor>=1.2.1,<2; platform_system == 'Windows'",
    "nvidia-ml-py>=13.590,<14; platform_system == 'Windows'",
    "psutil>=7.0,<8",
    "PyQt6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
llamacpp-launcher = "llamacpp_launcher.qt_ui.app:main"

[tool.setuptools.packages.find]
include = ["llamacpp_launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyqt6"
